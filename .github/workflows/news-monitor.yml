name: Market News Monitor

on:
  schedule:
    - cron: '*/10 3-12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run news monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_monitor.py

      - name: Save dedup + watchlist state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_announcements.json
          git diff --staged --quiet || git commit -m "update seen announcements [skip ci]"
          git push
